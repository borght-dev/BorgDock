# Lefthook pre-commit checks. Run with `bunx lefthook run pre-commit` to test
# manually. Bypass for emergencies with `LEFTHOOK=0 git commit ...`.
#
# Cross-platform notes:
# - Lefthook itself runs natively on macOS, Linux, and Windows (no shell dep).
# - We use `root:` instead of `cd <dir> && ...` so the cwd change works
#   regardless of the user's shell (cmd.exe, PowerShell, bash, zsh).
# - `bunx <cli>` is portable — bun ships as a single binary on every platform.
pre-commit:
  parallel: true
  commands:
    biome:
      root: "src/BorgDock.Tauri/"
      # The glob gates whether the hook fires; biome.json's `files.includes` is
      # the real authority on what gets checked. They don't line up perfectly —
      # e.g. `src/generated/**` matches this glob but is excluded by biome.json
      # — so a staged generated file would hand biome a path it ignores, and
      # biome exits 1 on "0 files". `--no-errors-on-unmatched` makes that a
      # no-op instead of a failed commit.
      glob:
        - "src/BorgDock.Tauri/src/**/*.{ts,tsx,js,jsx}"
        - "src/BorgDock.Tauri/.storybook/**/*.{ts,tsx,js,jsx}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    typecheck:
      # tsc has no per-file mode; we run the whole project. The glob just
      # gates whether the hook fires at all when relevant files are staged.
      root: "src/BorgDock.Tauri/"
      glob: "src/**/*.{ts,tsx}"
      run: bunx tsc --noEmit
