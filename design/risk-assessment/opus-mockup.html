<style>
/* Regression risk mockup for Quick Review. Everything is scoped to .rkm; the outer canvas stays transparent. */
.rkm {
  color-scheme: light dark;
  --rk-surface: light-dark(#ffffff, #1b1c1f);
  --rk-raised: light-dark(rgba(23, 24, 28, 0.03), #212226);
  --rk-hover: light-dark(rgba(23, 24, 28, 0.04), rgba(255, 255, 255, 0.028));
  --rk-sep: light-dark(#e5e6ea, rgba(255, 255, 255, 0.065));
  --rk-strong: light-dark(#d4d6dc, rgba(255, 255, 255, 0.12));
  --rk-t1: light-dark(#17181c, #ededef);
  --rk-t2: light-dark(#5d606a, #9c9da4);
  --rk-t3: light-dark(#6d707a, #82838a);
  --rk-faint: light-dark(#c2c4cb, #3f4046);
  --rk-accent: light-dark(#4f46e5, #7f7eff);
  --rk-accent-subtle: light-dark(rgba(79, 70, 229, 0.1), rgba(127, 126, 255, 0.15));
  --rk-purple: light-dark(#4f46e5, #9d9cff);
  --rk-selected: light-dark(rgba(79, 70, 229, 0.07), rgba(127, 126, 255, 0.1));
  --rk-green: light-dark(#1f9d6b, #5cc98f);
  --rk-red: light-dark(#d64560, #f0616d);
  --rk-yellow: light-dark(#c98a12, #e5b454);
  --rk-gray: light-dark(#8f929c, #67686f);
  --rk-ok-bg: light-dark(rgba(31, 157, 107, 0.08), rgba(92, 201, 143, 0.1));
  --rk-ok-fg: light-dark(#1a7f57, #5cc98f);
  --rk-ok-border: light-dark(rgba(31, 157, 107, 0.22), rgba(92, 201, 143, 0.25));
  --rk-warn-bg: light-dark(rgba(201, 138, 18, 0.1), rgba(229, 180, 84, 0.1));
  --rk-warn-fg: light-dark(#8f620b, #e5b454);
  --rk-warn-border: light-dark(rgba(201, 138, 18, 0.24), rgba(229, 180, 84, 0.22));
  --rk-err-bg: light-dark(rgba(214, 69, 96, 0.07), rgba(240, 97, 109, 0.1));
  --rk-err-fg: light-dark(#bf3552, #f0616d);
  --rk-err-border: light-dark(rgba(214, 69, 96, 0.2), rgba(240, 97, 109, 0.24));
  --rk-gray-bg: light-dark(rgba(23, 24, 28, 0.045), rgba(255, 255, 255, 0.05));
  --rk-gray-fg: light-dark(#5d606a, #9c9da4);
  --rk-gray-border: light-dark(#d4d6dc, rgba(255, 255, 255, 0.12));
  --rk-head-bg: light-dark(#f8f8ff, #1d1d26);
  --rk-code-bg: light-dark(#f7f7f9, #18191c);
  --rk-add: light-dark(rgba(31, 157, 107, 0.08), rgba(92, 201, 143, 0.1));
  --rk-del: light-dark(rgba(214, 69, 96, 0.07), rgba(240, 97, 109, 0.1));
  --rk-hunk: light-dark(rgba(23, 24, 28, 0.04), rgba(255, 255, 255, 0.04));
  --rk-ln: light-dark(#9a9da6, #5f6067);
  --rk-s-kw: light-dark(#6b3fd4, #b4a8ff);
  --rk-s-str: light-dark(#136c49, #7fd6a8);
  --rk-s-com: light-dark(#5d5f68, #9698a0);
  --rk-s-num: light-dark(#8b5200, #f0bd6b);
  --rk-s-type: light-dark(#0a6879, #6cc6d8);
  --rk-s-fn: light-dark(#2d56c8, #8fb4ff);
  --rk-s-tag: light-dark(#af2c48, #f07d8c);
  --rk-s-prop: light-dark(#1d5c96, #a9c7f0);
  --rk-shadow: light-dark(0 1px 2px rgba(16, 18, 27, 0.04), 0 1px 2px rgba(0, 0, 0, 0.2));
  --rk-font-ui: "Inter Variable", Inter, "Segoe UI", system-ui, sans-serif;
  --rk-font-reading: "Instrument Sans Variable", "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --rk-font-code: "JetBrains Mono Variable", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --rk-fast: 150ms;
  --rk-ease: cubic-bezier(0.16, 1, 0.3, 1);
  font-family: var(--rk-font-ui);
  font-size: 13px;
  line-height: 1.45;
  color: var(--rk-t1);
  -webkit-font-smoothing: antialiased;
}
.rkm[data-theme="light"] { color-scheme: light; }
.rkm[data-theme="dark"] { color-scheme: dark; }
.rkm *, .rkm *::before, .rkm *::after { box-sizing: border-box; }
.rkm button { font: inherit; color: inherit; }
.rkm code { font-family: var(--rk-font-code); font-size: 0.92em; }
.rkm [hidden] { display: none !important; }
.rkm .rk-i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.rkm .rk-i--sm { width: 12px; height: 12px; }
.rkm .rk-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .rkm .rk-spin { animation: rk-spin 0.9s linear infinite; }
  .rkm .rk-skel i { animation: rk-pulse 1.4s ease-in-out infinite; }
}
@keyframes rk-spin { to { transform: rotate(360deg); } }
@keyframes rk-pulse { 50% { opacity: 0.45; } }

/* ── Mockup chrome (not product): illustrative tag and the Tweak guard ─── */
.rkm-guard { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; font: 12px/1.4 var(--font-sans, var(--rk-font-ui)); color: var(--muted-foreground, var(--rk-t2)); }
.rkm-guard__tag { padding: 1px 8px; border: 1px dashed currentColor; border-radius: 999px; font-size: 11px; font-weight: 600; }
.rkm-guard__txt { flex: 1 1 220px; min-width: 0; }
.rkm-tweak { flex: 1 1 100%; }
.rkm-tweak summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; padding: 3px 9px; border: 1px solid var(--border, var(--rk-strong)); border-radius: 6px; font-weight: 600; color: var(--foreground, var(--rk-t1)); }
.rkm-tweak summary::-webkit-details-marker { display: none; }
.rkm-tweak summary .rk-i { transition: transform var(--rk-fast) var(--rk-ease); }
.rkm-tweak[open] summary .rk-i { transform: rotate(90deg); }
.rkm-tweak__rows { display: grid; gap: 6px; margin-top: 8px; }
.rkm-tweak__row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.rkm-tweak__row > span { width: 44px; flex: none; }
.rkm-tweak__row button { padding: 2px 9px; border: 1px solid var(--border, var(--rk-strong)); border-radius: 999px; background: transparent; color: var(--foreground, var(--rk-t1)); font-size: 11.5px; cursor: pointer; }
.rkm-tweak__row button[aria-pressed="true"] { background: var(--foreground, var(--rk-t1)); border-color: var(--foreground, var(--rk-t1)); color: var(--background, var(--rk-surface)); }
.rkm-tweak__row button:focus-visible, .rkm-tweak summary:focus-visible { outline: 2px solid var(--ring, var(--rk-accent)); outline-offset: 1px; }

/* ── Product: a slice of the Quick Review dialog ───────────────────────── */
.rkm .rk-app { container: rk / inline-size; overflow: hidden; border: 1px solid var(--rk-sep); border-radius: 12px; background: var(--rk-surface); color: var(--rk-t1); }
.rkm .rk-deck { display: flex; align-items: flex-end; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--rk-sep); }
.rkm .rk-deck__title { flex: none; padding: 10px 0 11px; font-weight: 600; font-size: 13px; }
.rkm .rk-tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.rkm .rk-tabs::-webkit-scrollbar { display: none; }
.rkm .rk-tab { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 9px 9px 9px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--rk-t2); font-size: 12px; white-space: nowrap; cursor: pointer; transition: color var(--rk-fast) ease, border-color var(--rk-fast) ease; }
.rkm .rk-tab:hover { color: var(--rk-t1); }
.rkm .rk-tab[aria-selected="true"] { color: var(--rk-t1); border-bottom-color: var(--rk-accent); }
.rkm .rk-tab:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: -2px; border-radius: 5px; }
.rkm .rk-tab__num { font-variant-numeric: tabular-nums; }
.rkm .rk-tab__title { max-width: 130px; overflow: hidden; text-overflow: ellipsis; }

/* Level pip: a letter as well as a colour, so it reads without colour. */
.rkm .rk-pip { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1px solid var(--tone-border); background: var(--tone-bg); color: var(--tone-fg); font-size: 9.5px; font-weight: 700; line-height: 1; }
.rkm .rk-pip[data-stale] { border-style: dashed; }
.rkm .rk-pip .rk-i { width: 10px; height: 10px; }
.rkm [data-lvl="high"] { --tone: var(--rk-red); --tone-fg: var(--rk-err-fg); --tone-bg: var(--rk-err-bg); --tone-border: var(--rk-err-border); }
.rkm [data-lvl="medium"] { --tone: var(--rk-yellow); --tone-fg: var(--rk-warn-fg); --tone-bg: var(--rk-warn-bg); --tone-border: var(--rk-warn-border); }
.rkm [data-lvl="low"], .rkm [data-lvl="lower"] { --tone: var(--rk-green); --tone-fg: var(--rk-ok-fg); --tone-bg: var(--rk-ok-bg); --tone-border: var(--rk-ok-border); }
.rkm [data-lvl="unknown"], .rkm [data-lvl="none"] { --tone: var(--rk-gray); --tone-fg: var(--rk-gray-fg); --tone-bg: var(--rk-gray-bg); --tone-border: var(--rk-gray-border); }

/* PR header, as the card draws it. */
.rkm .rk-prhead { padding: 16px 20px 14px; border-bottom: 1px solid var(--rk-sep); background: linear-gradient(var(--rk-head-bg), var(--rk-surface)); }
.rkm .rk-prhead__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--rk-t2); }
.rkm .rk-prhead__meta b { color: var(--rk-t1); font-weight: 600; }
.rkm .rk-av { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--rk-accent-subtle); color: var(--rk-purple); font-size: 9.5px; font-weight: 600; }
.rkm .rk-av[data-bot] { background: var(--rk-gray-bg); color: var(--rk-t2); }
.rkm .rk-prhead h2 { margin: 6px 0 10px; font: 600 18px/1.3 var(--rk-font-reading); letter-spacing: -0.005em; text-wrap: balance; }
.rkm .rk-prhead h2 span { color: var(--rk-t3); font-weight: 500; font-variant-numeric: tabular-nums; }
.rkm .rk-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rkm .rk-size { font-size: 12px; color: var(--rk-t2); font-variant-numeric: tabular-nums; }
.rkm .rk-plus { color: var(--rk-green); }
.rkm .rk-minus { color: var(--rk-red); }
.rkm .rk-pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border: 1px solid var(--tone-border); border-radius: 999px; background: var(--tone-bg); color: var(--tone-fg); font-size: 11px; font-weight: 600; white-space: nowrap; }
.rkm .rk-pill[data-tone="ok"] { --tone-border: var(--rk-ok-border); --tone-bg: var(--rk-ok-bg); --tone-fg: var(--rk-ok-fg); }
.rkm .rk-pill[data-tone="warn"] { --tone-border: var(--rk-warn-border); --tone-bg: var(--rk-warn-bg); --tone-fg: var(--rk-warn-fg); }
.rkm .rk-pill[data-tone="ghost"] { --tone-border: var(--rk-strong); --tone-bg: transparent; --tone-fg: var(--rk-t2); }
.rkm .rk-pill[data-stale] { border-style: dashed; }
.rkm .rk-pill .rk-i { width: 11px; height: 11px; }

/* Buttons, after the shared primitives. */
.rkm .rk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 24px; padding: 0 9px; border: 1px solid var(--rk-strong); border-radius: 5px; background: var(--rk-surface); color: var(--rk-t1); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background var(--rk-fast) ease, transform 80ms ease; }
.rkm .rk-btn:hover { background: var(--rk-hover); }
.rkm .rk-btn:active { transform: scale(0.97); }
.rkm .rk-btn--ghost { border-color: transparent; background: transparent; color: var(--rk-t2); }
.rkm .rk-btn--ghost:hover { color: var(--rk-t1); }
.rkm .rk-btn--icon { width: 26px; padding: 0; }
.rkm .rk-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
.rkm .rk-btn:focus-visible, .rkm .rk-link:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
.rkm .rk-link { padding: 0; border: 0; background: none; color: var(--rk-accent); font-weight: 500; cursor: pointer; }
.rkm .rk-link:hover { text-decoration: underline; }

/* Card body: the risk section sits first in the reading column. */
.rkm .rk-body { display: flex; flex-direction: column; gap: 22px; padding: 18px 20px 22px; }
.rkm .rk-h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 11px; font-weight: 600; line-height: 1.3; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rk-t2); }
.rkm .rk-h3 small { letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 11.5px; color: var(--rk-t3); }
.rkm .rk-h3 .rk-btn { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* The verdict: level on a three-step scale, one sentence, where it came from. */
.rkm .rk-verdict { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 12px 18px; padding: 14px 16px 12px; border: 1px solid var(--rk-sep); border-radius: 10px; background: var(--rk-raised); box-shadow: inset 3px 0 0 var(--tone); }
.rkm .rk-verdict[data-stale] { box-shadow: none; border-style: dashed; border-color: var(--rk-strong); }
.rkm .rk-level__word { display: flex; align-items: center; gap: 7px; margin: 0; font: 600 20px/1.15 var(--rk-font-reading); color: var(--tone-fg); }
.rkm .rk-level__word .rk-i { width: 18px; height: 18px; }
.rkm .rk-level__sub { display: block; margin-top: 3px; font-size: 11px; color: var(--rk-t3); }
.rkm .rk-scale { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 10px; }
.rkm .rk-scale span { position: relative; padding-top: 8px; font-size: 10px; line-height: 1.2; color: var(--rk-t3); }
.rkm .rk-scale span::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; border-radius: 2px; background: var(--rk-sep); }
.rkm .rk-scale span[data-on] { color: var(--rk-t1); font-weight: 600; }
.rkm .rk-scale span[data-on]::before { background: var(--tone); }
.rkm .rk-verdict[data-stale] .rk-scale span[data-on]::before { background: repeating-linear-gradient(90deg, var(--tone) 0 5px, transparent 5px 8px); }
.rkm .rk-verdict[data-lvl="unknown"] .rk-scale span::before { background: repeating-linear-gradient(135deg, var(--rk-strong) 0 2px, transparent 2px 5px); }
.rkm .rk-headline { margin: 0; font: 500 15px/1.45 var(--rk-font-reading); color: var(--rk-t1); text-wrap: pretty; }
.rkm .rk-headline--quiet { color: var(--rk-t2); font-weight: 400; }
.rkm .rk-decided { margin: 6px 0 0; font-size: 12px; color: var(--rk-t2); }
.rkm .rk-decided .rk-link { font-family: var(--rk-font-code); font-size: 11.5px; }
.rkm .rk-verdict .rk-cta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.rkm .rk-prov { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding-top: 10px; border-top: 1px solid var(--rk-sep); font-size: 11.5px; color: var(--rk-t2); }
.rkm .rk-prov > span { display: inline-flex; align-items: center; gap: 5px; }
.rkm .rk-prov code { color: var(--rk-t1); font-size: 11px; }
.rkm .rk-prov .rk-i { color: var(--rk-t3); width: 12px; height: 12px; }
.rkm .rk-fresh { padding: 0 6px; border: 1px solid; border-radius: 999px; font-size: 10.5px; font-weight: 600; line-height: 16px; }
.rkm .rk-fresh[data-f="current"] { border-color: var(--rk-ok-border); background: var(--rk-ok-bg); color: var(--rk-ok-fg); }
.rkm .rk-fresh[data-f="behind"] { border-color: var(--rk-warn-border); background: var(--rk-warn-bg); color: var(--rk-warn-fg); }
.rkm .rk-fresh[data-f="busy"] { border-color: var(--rk-strong); color: var(--rk-t2); }

/* Banners for stale, failed and unknown. */
.rkm .rk-alert { display: flex; align-items: flex-start; gap: 10px; margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--rk-warn-border); border-radius: 8px; background: var(--rk-warn-bg); font-size: 12.5px; line-height: 1.5; color: var(--rk-t1); }
.rkm .rk-alert > .rk-i { margin-top: 2px; color: var(--rk-warn-fg); }
.rkm .rk-alert > span { flex: 1; min-width: 0; }
.rkm .rk-alert[data-tone="error"] { border-color: var(--rk-err-border); background: var(--rk-err-bg); }
.rkm .rk-alert[data-tone="error"] > .rk-i { color: var(--rk-err-fg); }
.rkm .rk-alert[data-tone="neutral"] { border-color: var(--rk-sep); background: var(--rk-gray-bg); }
.rkm .rk-alert[data-tone="neutral"] > .rk-i { color: var(--rk-t2); }
.rkm .rk-note { margin: 8px 2px 0; font-size: 12px; color: var(--rk-t2); }

/* Reasons. */
.rkm .rk-groups { display: grid; gap: 16px; margin-top: 18px; }
.rkm .rk-group__h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 7px; font-size: 12.5px; font-weight: 600; color: var(--rk-t1); }
.rkm .rk-group__h span { font-weight: 400; color: var(--rk-t3); font-variant-numeric: tabular-nums; }
.rkm .rk-group__h small { margin-left: auto; font-weight: 400; font-size: 11.5px; color: var(--rk-t3); }
.rkm .rk-reasons { margin: 0; padding: 0; list-style: none; border: 1px solid var(--rk-sep); border-radius: 10px; overflow: hidden; }
.rkm .rk-reason + .rk-reason { border-top: 1px solid var(--rk-sep); }
.rkm .rk-reason__row { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 12px; padding: 11px 14px 12px 12px; cursor: pointer; transition: background var(--rk-fast) ease; }
.rkm .rk-reason__row:hover { background: var(--rk-hover); }
.rkm .rk-reason[data-open] > .rk-reason__row { background: var(--rk-raised); }
.rkm .rk-reason__tag { display: grid; align-content: start; gap: 3px; padding-top: 1px; }
.rkm .rk-rid { font: 600 11px/1.2 var(--rk-font-code); color: var(--rk-t3); }
.rkm .rk-rlvl { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--tone-fg); }
.rkm .rk-rlvl .rk-i { width: 12px; height: 12px; }
.rkm .rk-reason__title { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 0; border: 0; background: none; text-align: left; font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--rk-t1); cursor: pointer; }
.rkm .rk-reason__title > span { flex: 1; min-width: 0; }
.rkm .rk-reason__title .rk-i { margin-top: 2px; color: var(--rk-t3); transition: transform var(--rk-fast) var(--rk-ease); }
.rkm .rk-reason[data-open] .rk-reason__title .rk-i { transform: rotate(90deg); }
.rkm .rk-reason__title:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 2px; border-radius: 4px; }
.rkm .rk-because { margin: 3px 0 8px; font-size: 12.5px; line-height: 1.5; color: var(--rk-t2); text-wrap: pretty; }
.rkm .rk-because code { color: var(--rk-t1); }
.rkm .rk-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rkm .rk-anchor { display: inline-flex; align-items: center; gap: 6px; height: 22px; max-width: 100%; padding: 0 7px; border: 1px solid var(--rk-strong); border-radius: 5px; background: var(--rk-surface); font: 11px var(--rk-font-code); color: var(--rk-t1); cursor: pointer; transition: background var(--rk-fast) ease, border-color var(--rk-fast) ease; }
.rkm .rk-anchor > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rkm .rk-anchor small { flex: none; font: 10.5px var(--rk-font-ui); color: var(--rk-t3); }
.rkm .rk-anchor[data-where="outside"], .rkm .rk-anchor[data-where="body"] { border-style: dashed; }
.rkm .rk-anchor:hover { background: var(--rk-hover); border-color: var(--rk-t3); }
.rkm .rk-anchor:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
.rkm .rk-test { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 5px; margin-left: 2px; font-size: 11.5px; color: var(--rk-t2); }
.rkm .rk-test .rk-i { width: 12px; height: 12px; }
.rkm .rk-test[data-s="none"] .rk-i, .rkm .rk-test[data-s="part"] .rk-i { color: var(--rk-yellow); }
.rkm .rk-test[data-s="yes"] .rk-i { color: var(--rk-green); }
.rkm .rk-test[data-s="unknown"] .rk-i { color: var(--rk-t3); }
.rkm .rk-test .rk-anchor { height: 20px; }
.rkm .rk-changed { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 1px 7px; border: 1px dashed var(--rk-warn-border); border-radius: 999px; background: var(--rk-warn-bg); color: var(--rk-warn-fg); font-size: 11px; font-weight: 600; }
.rkm .rk-reason[data-changed] .rk-because { opacity: 0.75; }

/* Evidence, opened from a reason. */
.rkm .rk-evidence { display: grid; gap: 10px; padding: 2px 14px 14px 86px; background: var(--rk-raised); }
.rkm .rk-why { margin: 0; font-size: 12.5px; color: var(--rk-t1); }
.rkm .rk-why b { font-weight: 600; color: var(--tone-fg); margin-right: 4px; }
.rkm .rk-snip { margin: 0; border: 1px solid var(--rk-sep); border-radius: 8px; overflow: hidden; background: var(--rk-surface); }

  const eff = (pr) => (st(pr) === 'sampled' ? pr.risk.state : st(pr));
  const lvlOf = (r) => (r.dir === 'lower' ? 'lower' : r.lvl);
  const agent = (pr) => pr.risk.by.split(' ·')[0];
  const opened = (pr) => state.open[pr.id] ?? (state.open[pr.id] = new Set());
  const allFiles = (pr) => [...pr.files, ...pr.outside];
  const fileOf = (pr, path) => allFiles(pr).find((f) => f.path === path);
  const isOutside = (pr, path) => pr.outside.some((f) => f.path === path);
  const whereOf = (pr, path) => (fileOf(pr, path)?.body ? 'body' : isOutside(pr, path) ? 'outside' : 'diff');
  const WHERE = { diff: 'in this PR', outside: 'outside the diff', body: 'PR description' };
  const READ = { full: 'Read in full', cut: 'Cut at the prompt budget', name: 'By name only', outside: 'Outside the diff', body: 'Read for context' };
  // Middle-truncate so two long names in the same folder still differ at their ends.
  const short = (name, max = 20) => (name.length > max ? `${name.slice(0, 9)}…${name.slice(-(max - 10))}` : name);
  const totals = (pr) => pr.totals ?? pr.files.reduce((t, f) => ({ add: t.add + f.add, del: t.del + f.del }), { add: 0, del: 0 });

  function citations(pr) {
    const out = [];
    for (const r of pr.risk.reasons) {
      for (const a of r.cites) out.push({ r, a });
      if (r.test?.at) out.push({ r, a: r.test.at, test: true });
    }
    return out;
  }

  // The commit pushed after the assessment, in the Stale preview: it touches the first file R1 cites.
  function staleInfo(pr) {
    const first = pr.risk.reasons[0]?.cites.find((a) => whereOf(pr, a.f) === 'diff');
    const changed = first?.f ?? pr.files[0].path;
    const hit = pr.risk.reasons.filter((r) => r.cites.some((a) => a.f === changed));
    return { head: '2be03f1', newer: 2, pushed: '3 min ago', changed, hit };
  }

  /* Tiny highlighter: enough to read the samples, same tokens as the app's syntax colours. */
  const STRQ = "'(?:[^'\\\\]|\\\\.)*'|\"(?:[^\"\\\\]|\\\\.)*\"";
  const LANG = {
    ts: [["\\/\\/.*$|\\/\\*.*?\\*\\/", 'com'], [STRQ + '|`(?:[^`\\\\]|\\\\.)*`', 'str'],
      ['\\b(?:import|from|export|function|const|let|return|if|for|of|await|async|type|interface|new|true|false|null|it|expect|describe|as)\\b', 'kw'],
      ['\\b\\d+(?:\\.\\d+)?\\b', 'num'], ['\\b[A-Z][A-Za-z0-9]*\\b', 'type'], ['\\b[a-zA-Z_$][\\w$]*(?=\\()', 'fn']],
    sql: [['--.*$', 'com'], ["'(?:[^']|'')*'", 'str'], ['\\b(?:ALTER|TABLE|ADD|COLUMN|COMMENT|ON|IS|NULL|integer)\\b', 'kw'], ['\\b\\d+\\b', 'num']],
    yaml: [['#.*$', 'com'], ['^\\s*[\\w@.\\/-]+(?=:)', 'prop'], [STRQ, 'str'], ['\\b\\d+(?:\\.\\d+)*\\b', 'num']],
    json: [['"(?:[^"\\\\]|\\\\.)*"(?=\\s*:)', 'prop'], [STRQ, 'str'], ['\\b(?:true|false|null)\\b', 'kw'], ['\\b\\d+(?:\\.\\d+)?\\b', 'num']],
    html: [['<!--.*?-->', 'com'], ['\\{\\{[^}]*\\}\\}', 'prop'], ['<\\/?[a-z][\\w-]*|\\/?>', 'tag'], ['"[^"]*"', 'str']],
  };
  const RX = Object.fromEntries(Object.entries(LANG).map(([k, parts]) => [k, { re: new RegExp(parts.map(([s]) => `(${s})`).join('|'), 'g'), cls: parts.map(([, c]) => c) }]));
  function hl(text, lang) {
    const spec = RX[lang];
    if (!spec || !text) return esc(text);
    const { re, cls } = spec;
    re.lastIndex = 0;
    let out = '';
    let last = 0;
    let m;
    while ((m = re.exec(text))) {
      if (!m[0]) { re.lastIndex++; continue; }
      const g = m.slice(1).findIndex((x) => x !== undefined);
      out += esc(text.slice(last, m.index)) + `<span class="rk-s-${cls[g]}">${esc(m[0])}</span>`;
      last = re.lastIndex;
    }
    return out + esc(text.slice(last));
  }

  const flat = (file) => (file.hunks ?? []).flatMap((h) => [{ t: 'hunk', text: h.h }, ...h.rows.map((r) => (r[0] === 'gap' ? { t: 'gap', text: r[1] } : { t: r[0], o: r[1], n: r[2], text: r[3] }))]);
  function cites(anchor, row) {
    if (row.t === 'hunk' || row.t === 'gap') return false;
    if (row.n != null && row.n >= anchor.a && row.n <= anchor.b) return true;
    return row.t === '-' && !!anchor.old && row.o >= anchor.old[0] && row.o <= anchor.old[1];
  }

  function codeBlock(file, rows, marks, single) {
    let prev = new Set();
    const html = rows.map((row) => {
      if (row.t === 'hunk' || row.t === 'gap') {
        prev = new Set();
        return `<div class="rk-l" data-t="${row.t}">${row.t === 'gap' ? '⋯ ' : ''}${esc(row.text)}</div>`;
      }
      const hits = marks.filter((m) => cites(m.anchor, row));
      const label = hits.find((h) => !prev.has(h.r.id))?.r.id;
      prev = new Set(hits.map((h) => h.r.id));
      const top = hits.find((h) => h.current) ?? hits[0];
      const cur = hits.some((h) => h.current);
      const sign = row.t === '+' ? '+' : row.t === '-' ? '−' : '';
      return `<div class="rk-l" data-t="${row.t}"${top ? ` data-lvl="${lvlOf(top.r)}"` : ''}${cur ? ' data-current' : ''}><span class="rk-l__m">${label ? `<b>${label}</b>` : ''}</span><span class="rk-l__o">${row.t === 'o' ? '' : row.o ?? ''}</span><span class="rk-l__n">${row.n ?? ''}</span><span class="rk-l__s">${sign}</span><span class="rk-l__c">${hl(row.text, file.lang) || ' '}</span></div>`;
    }).join('');
    return `<div class="rk-code"${single ? ' data-single' : ''}><div class="rk-code__in">${html}</div></div>`;
  }

  /* ── Pieces ───────────────────────────────────────────────────────────── */
  function pip(pr) {
    const s = eff(pr);
    if (s === 'assessing') return `<span class="rk-pip" data-lvl="none">${icon('loader', 'rk-spin')}</span>`;
    if (s === 'failed' || s === 'idle') return '<span class="rk-pip" data-lvl="none">–</span>';
    return `<span class="rk-pip" data-lvl="${pr.risk.level}"${s === 'stale' ? ' data-stale' : ''}>${LVL[pr.risk.level].letter}</span>`;
  }

  function tabs() {
    return PRS.map((pr) => {
      const s = eff(pr);
      const word = s === 'assessing' ? 'assessing' : s === 'failed' || s === 'idle' ? 'not assessed' : `${LVL[pr.risk.level].word.toLowerCase()} risk${s === 'stale' ? ', stale' : ''}`;
      return `<button type="button" class="rk-tab" role="tab" aria-selected="${pr.id === state.pr}" data-act="pr" data-id="${pr.id}" data-fk="tab-${pr.id}" aria-label="#${pr.num}, ${word}">${pip(pr)}<span class="rk-tab__num">#${pr.num}</span><span class="rk-tab__title">${esc(pr.title)}</span></button>`;
    }).join('');
  }

  function riskPill(pr) {
    const s = eff(pr);
    if (s === 'assessing') return `<span class="rk-pill" data-tone="ghost">${icon('loader', 'rk-spin')}Assessing risk</span>`;
    if (s === 'failed') return `<span class="rk-pill" data-tone="ghost">${icon('alert')}Risk not assessed</span>`;
    if (s === 'idle') return '<span class="rk-pill" data-tone="ghost">Risk not assessed</span>';
    const L = pr.risk.level;
    const label = L === 'unknown' ? 'Risk unknown' : `${LVL[L].word} risk`;
    return `<span class="rk-pill" data-lvl="${L}"${s === 'stale' ? ' data-stale' : ''}>${icon(L === 'unknown' ? 'help' : L === 'low' ? 'check' : 'alert')}${label}${s === 'stale' ? ' · older commit' : ''}</span>`;
  }

  function prHead(pr) {
    const t = totals(pr);
    const files = pr.files.length;
    const av = pr.bot ? `<span class="rk-av" data-bot>${icon('bot', 'rk-i--sm')}</span>` : `<span class="rk-av">${pr.initials}</span>`;
    return `<header class="rk-prhead">
      <div class="rk-prhead__meta">${av}<b>${esc(pr.author)}</b><span>into <code>main</code></span><span aria-hidden="true">·</span><span>opened ${pr.opened}</span></div>
      <h2>${esc(pr.title)} <span>#${pr.num}</span></h2>
      <div class="rk-chips">
        <span class="rk-pill" data-tone="${pr.ci.tone}">${icon(pr.ci.tone === 'ok' ? 'check' : 'loader')}${pr.ci.label}</span>
        ${riskPill(pr)}
        <span class="rk-size">${plural(files, 'file')} · <span class="rk-plus">+${fmt(t.add)}</span> <span class="rk-minus">−${fmt(t.del)}</span> · ${plural(pr.commits, 'commit')}</span>
      </div>
    </header>`;
  }

  function scale(level) {
    const on = level ? LVL[level].on : -2;
    return `<div class="rk-scale" aria-hidden="true">${['Low', 'Medium', 'High'].map((w, i) => `<span${i === on ? ' data-on' : ''}>${w}</span>`).join('')}</div>`;
  }

  function guideNote(pr) {
    const assessed = ['ready', 'stale', 'unknown'].includes(eff(pr));
    return pr.guide.s === 'skipped'
      ? `<span>${icon('book')}No guide (${esc(pr.guide.t.toLowerCase())}). ${assessed ? 'Risk is assessed anyway.' : "Risk doesn't wait for one."}</span>`
      : `<span>${icon('book')}Guide: ${esc(pr.guide.t)}</span>`;
  }

  function verdict(pr) {
    const s = eff(pr);
    const R = pr.risk;
    const ready = s === 'ready' || s === 'unknown' || s === 'stale';
    const level = ready ? R.level : null;
    const lvl = level ?? 'none';
    let word;
    let main;
    let prov;
    if (s === 'assessing') {
      word = `${icon('loader', 'rk-spin')}Assessing`;
      main = `<p class="rk-headline rk-headline--quiet">${agent(pr)} is reading the diff and the code it calls. It cites a line for every reason. You can start the walk meanwhile.</p>`;
      prov = `<span>${icon('commit')}<code>${R.head}</code><span class="rk-fresh" data-f="busy">Head</span></span><span>${icon('clock')}Started 40 s ago</span><span>${R.by}</span>${guideNote(pr)}`;
    } else if (s === 'failed') {
      word = 'Not assessed';
      main = '<p class="rk-headline rk-headline--quiet">No assessment for this commit. Not assessed is not Low.</p>';
      prov = `<span>${icon('commit')}<code>${R.head}</code></span><span>${icon('clock')}Failed 1 min ago</span><span>${R.by}</span>${guideNote(pr)}`;
    } else if (s === 'idle') {
      word = 'Not assessed';
      main = `<p class="rk-headline rk-headline--quiet">${agent(pr)} can read the diff and the code it calls, and say what could break, with a line for every reason.</p>
        <div class="rk-cta"><button type="button" class="rk-btn" data-act="assess" data-fk="assess">Assess risk</button></div>`;
      prov = `<span>${icon('commit')}<code>${R.head}</code><span class="rk-fresh" data-f="busy">Head</span></span>${guideNote(pr)}`;
    } else {
      const decided = R.level === 'unknown'
        ? 'Unknown until more of it is read. Below is what it saw so far.'
        : R.decided
          ? `Its highest reason sets the level: <button type="button" class="rk-link" data-act="jump" data-r="${R.decided}" data-fk="jump">${R.decided}</button>.`
          : `${R.reasons.map((r) => r.id).join(' and ')} keep it down.`;
      word = `${icon(level === 'unknown' ? 'help' : level === 'low' ? 'check' : 'alert')}${LVL[level].word}`;
      main = `<p class="rk-headline">${esc(R.headline)}</p><p class="rk-decided">${decided}</p>`;
      if (s === 'stale') {
        const x = staleInfo(pr);
        prov = `<span>${icon('commit')}Assessed <code>${R.head}</code><span class="rk-fresh" data-f="behind">${x.newer} commits behind</span></span><span><span>Head <code>${x.head}</code>, pushed ${x.pushed}</span></span><span>${R.by}</span>${guideNote(pr)}`;
      } else {
        prov = `<span>${icon('commit')}<code>${R.head}</code><span class="rk-fresh" data-f="current">Current head</span></span><span>${icon('clock')}${R.ago}</span><span>${R.by}</span>${guideNote(pr)}`;
      }
    }
    const sub = s === 'stale' ? `<span class="rk-level__sub">for <code>${R.head}</code>, not the head</span>` : '';
    return `<div class="rk-verdict" data-lvl="${lvl}"${s === 'stale' ? ' data-stale' : ''}>
      <div class="rk-level"><div><p class="rk-level__word">${word}</p>${sub}</div>${scale(level)}</div>
      <div class="rk-verdict__main">${main}</div>
      <div class="rk-prov">${prov}</div>
    </div>`;
  }

  function anchorChip(pr, a, ci) {
    const w = whereOf(pr, a.f);
    const label = w === 'body' ? `description:${range(a)}` : `${base(a.f)}:${range(a)}`;
    return `<button type="button" class="rk-anchor" data-where="${w}" data-act="walk" data-ci="${ci}" data-fk="cite-${ci}" title="${esc(a.f)}, lines ${range(a)} (${WHERE[w]})"><span>${esc(label)}</span>${w === 'diff' ? '' : `<small>${w === 'body' ? 'release notes' : 'outside diff'}</small>`}</button>`;
  }

  function snippet(pr, a, ci, r) {
    const file = fileOf(pr, a.f);
    const rows = flat(file);
    const idx = rows.map((row, i) => (cites(a, row) ? i : -1)).filter((i) => i >= 0);
    if (!idx.length) return '';
    const from = Math.max(0, idx[0] - 2);
    const to = Math.min(rows.length, idx[idx.length - 1] + 3);
    const slice = rows.slice(from, to).filter((row) => row.t !== 'hunk');
    const w = whereOf(pr, a.f);
    return `<figure class="rk-snip">
      <figcaption><code>${esc(a.f)}</code><span>${w === 'body' ? 'line' : 'lines'} ${range(a)}</span><span class="rk-where" data-where="${w}">${WHERE[w]}</span>
        <button type="button" class="rk-btn rk-btn--ghost" data-act="walk" data-ci="${ci}" data-fk="open-${ci}">Open in walk${icon('right', 'rk-i--sm')}</button></figcaption>
      ${codeBlock(file, slice, [{ r, anchor: a, current: true }], w !== 'diff')}
    </figure>`;
  }

  function reasonItem(pr, r, cits, stale) {
    const open = opened(pr).has(r.id);
    const ci = (a) => cits.findIndex((c) => c.a === a);
    const changed = stale && stale.hit.includes(r);
    const lvl = lvlOf(r);
    const tag = r.dir === 'lower' ? `${icon('down')}Lowers` : `${icon('up')}${LVL[r.lvl].word}`;
    const test = r.test
      ? `<span class="rk-test" data-s="${r.test.s}">${icon(r.test.s === 'yes' ? 'check' : r.test.s === 'unknown' ? 'help' : 'flask')}<span>${esc(r.test.t)}</span>${r.test.at ? ` ${anchorChip(pr, r.test.at, ci(r.test.at))}` : ''}</span>`
      : '';
    return `<li class="rk-reason" data-lvl="${lvl}" id="rk-r-${pr.id}-${r.id}"${open ? ' data-open' : ''}${changed ? ' data-changed' : ''}>
      <div class="rk-reason__row" data-act="toggle" data-r="${r.id}">
        <div class="rk-reason__tag"><span class="rk-rid">${r.id}</span><span class="rk-rlvl">${tag}</span></div>
        <div class="rk-reason__main">
          <button type="button" class="rk-reason__title" data-act="toggle" data-r="${r.id}" data-fk="toggle-${r.id}" aria-expanded="${open}" aria-controls="rk-ev-${pr.id}-${r.id}"><span>${esc(r.title)}</span>${icon('right')}</button>
          <p class="rk-because">${r.because}</p>
          <div class="rk-meta">${r.cites.map((a) => anchorChip(pr, a, ci(a))).join('')}${test}</div>
          ${changed ? `<span class="rk-changed">${icon('alert', 'rk-i--sm')}${esc(base(stale.changed))} changed since. This may no longer hold.</span>` : ''}
        </div>
      </div>
      <div class="rk-evidence" id="rk-ev-${pr.id}-${r.id}"${open ? '' : ' hidden'}>
        <p class="rk-why"><b>${r.dir === 'lower' ? 'Keeps it down.' : `Why ${LVL[r.lvl].word.toLowerCase()}.`}</b>${esc(r.why)}</p>
        ${r.cites.map((a) => snippet(pr, a, ci(a), r)).join('')}
      </div>
    </li>`;
  }

  function reasons(pr) {
    const s = eff(pr);
    const cits = citations(pr);
    const stale = s === 'stale' ? staleInfo(pr) : null;
    const raise = pr.risk.reasons.filter((r) => r.dir === 'raise');
    const lower = pr.risk.reasons.filter((r) => r.dir === 'lower');
    const unknown = pr.risk.level === 'unknown';
    const out = [];
    if (raise.length) {
      out.push(`<div class="rk-group"><h4 class="rk-group__h">${unknown ? 'Seen in what it read' : 'What could break'} <span>${raise.length}</span>${unknown ? '<small>Not a verdict</small>' : ''}</h4><ol class="rk-reasons">${raise.map((r) => reasonItem(pr, r, cits, stale)).join('')}</ol></div>`);
    } else {
      out.push(`<p class="rk-none"><b>Nothing found that could break.</b> Low covers what it read. See its limits below.</p>`);
    }
    if (lower.length) {
      out.push(`<div class="rk-group"><h4 class="rk-group__h">What keeps it down <span>${lower.length}</span></h4><ol class="rk-reasons">${lower.map((r) => reasonItem(pr, r, cits, stale)).join('')}</ol></div>`);
    }
    return `<div class="rk-groups">${out.join('')}</div>`;
  }

  function coverage(pr) {
    const cits = citations(pr);
    const citedBy = (path) => [...new Map(cits.filter((c) => c.a.f === path).map((c) => [c.r.id, c.r])).values()];
    const states = new Set(pr.files.map((f) => f.read));
    if (pr.outside.length) states.add('outside');
    let map;
    if (pr.files.length <= 12) {
      const tile = (f, read) => {
        const by = citedBy(f.path);
        const meta = f.body ? 'release notes' : read === 'outside' ? 'not changed' : `<span class="rk-plus">+${f.add}</span><span class="rk-minus">−${f.del}</span>${f.gen ? ' gen' : ''}`;
        return `<button type="button" class="rk-tile" data-read="${read}" data-act="file" data-path="${esc(f.path)}" data-fk="file-${esc(f.path)}" title="${esc(f.path)} · ${READ[read]}">
          <span class="rk-rd" data-read="${read}"></span><span class="rk-tile__name">${esc(short(base(f.path)))}</span>
          <span class="rk-tile__meta">${meta}<span class="rk-cites">${by.map((r) => `<i data-lvl="${lvlOf(r)}">${r.id}</i>`).join('')}</span></span>
        </button>`;
      };
      map = `<div class="rk-tiles">${pr.files.map((f) => tile(f, f.read)).join('')}${pr.outside.length ? `<p class="rk-tiles__sep">Read outside the diff, to check what the change touches</p>${pr.outside.map((f) => tile(f, f.body ? 'body' : 'outside')).join('')}` : ''}</div>`;
    } else {
      map = `<div class="rk-cells" role="list" aria-label="Changed files by how they were read">${pr.files.map((f) => {
        const by = citedBy(f.path);
        return `<button type="button" role="listitem" class="rk-cell rk-rd" data-read="${f.read}"${by.length ? ` data-cited data-lvl="${lvlOf(by[0])}"` : ''} data-act="file" data-path="${esc(f.path)}" title="${esc(f.path)} · ${READ[f.read]}${by.length ? ` · cited by ${by.map((r) => r.id).join(', ')}` : ''}" aria-label="${esc(f.path)}, ${READ[f.read].toLowerCase()}"></button>`;
      }).join('')}</div>`;
    }
    const legend = ['full', 'cut', 'name', 'outside'].filter((k) => states.has(k)).map((k) => `<li><span class="rk-rd" data-read="${k}"></span>${READ[k]}</li>`).join('');
    return `<section class="rk-cov" aria-label="What the assessment read">
      <h4 class="rk-group__h">What it read <span>${plural(pr.files.length, 'changed file')}</span></h4>
      ${map}
      <ul class="rk-legend">${legend}</ul>
      <p class="rk-cov__sum">${pr.risk.cov}</p>
      <p class="rk-limits">${icon('eye')}<span>${esc(pr.risk.limits)}</span></p>
    </section>`;
  }

  function riskSection(pr) {
    const s = eff(pr);
    const R = pr.risk;
    let after = '';
    if (s === 'stale') {
      const x = staleInfo(pr);
      after = `<p class="rk-alert">${icon('alert')}<span>The head moved since this assessment. ${x.newer} new commits change <code>${esc(base(x.changed))}</code>, where ${x.hit.map((r) => r.id).join(' and ')} cite lines. The level and reasons below are for <code>${R.head}</code>.</span><button type="button" class="rk-btn" data-act="assess" data-fk="assess">Assess head</button></p>`;
    } else if (s === 'failed') {
      after = `<p class="rk-alert" data-tone="error">${icon('x')}<span>No assessment: ${agent(pr).toLowerCase()} exited with code 1. Usage limit reached, resets at 14:00.</span><button type="button" class="rk-btn" data-act="assess" data-fk="assess">Try again</button></p>`;
    } else if (s === 'unknown') {
      after = `<p class="rk-alert" data-tone="neutral">${icon('help')}<span><b>Why unknown.</b> ${R.unknownWhy}</span></p>`;
    }
    let body = '';
    if (s === 'assessing') {
      body = `<div class="rk-skel" aria-hidden="true">${[78, 64, 70].map((w) => `<div><span><i style="width:26px"></i><i style="width:44px"></i></span><span><i style="width:${w}%"></i><i style="width:${w - 18}%"></i><i style="width:38%"></i></span></div>`).join('')}</div>`;
    } else if (s === 'ready' || s === 'stale' || s === 'unknown') {
      body = reasons(pr) + coverage(pr);
    }
    const again = s === 'ready' || s === 'unknown'
      ? `<button type="button" class="rk-btn rk-btn--ghost" data-act="assess" data-fk="again" title="Assess this commit again">${icon('refresh', 'rk-i--sm')}Assess again</button>`
      : '';
    return `<section class="rk-risk" aria-label="Regression risk" aria-live="polite">
      <h3 class="rk-h3">Regression risk${again}</h3>
      ${verdict(pr)}${after}${body}
    </section>`;
  }

  function existingGuide(pr) {
    const text = pr.guide.s === 'skipped'
      ? `<span>${esc(pr.guide.t)}. It reads faster than a guide is written.</span><button type="button" class="rk-btn" tabindex="-1">Write guide</button>`
      : `<span>${esc(pr.guide.t)}. The walk follows its chapters.</span>`;
    return `<section class="rk-existing" aria-label="Review guide (existing)"><h3 class="rk-h3">Review guide <span class="rk-existing__tag">existing, unchanged</span></h3><p>${text}</p></section>`;
  }

  /* Walk drilldown: the file with every cited line marked, and a strip saying why. */
  function walk(pr) {
    const cits = citations(pr);
    const cur = cits[state.walk.ci];
    const path = state.walk.path;
    const file = fileOf(pr, path);
    const w = whereOf(pr, path);
    const stale = eff(pr) === 'stale' ? staleInfo(pr) : null;
    const marks = cits.filter((c) => c.a.f === path).map((c) => ({ r: c.r, anchor: c.a, current: c === cur }));
    const seen = new Map();
    for (const m of marks) {
      if (!seen.has(m.r.id)) seen.set(m.r.id, { r: m.r, lines: [] });
      seen.get(m.r.id).lines.push(range(m.anchor));
    }
    const strips = [...seen.values()].map(({ r, lines }) => `<div class="rk-strip" data-lvl="${lvlOf(r)}">${icon(r.dir === 'lower' ? 'down' : 'alert')}<p><b>${r.id} · ${r.dir === 'lower' ? 'Lowers' : LVL[r.lvl].word}</b> ${esc(r.title)}<em>Lines</em>${[...new Set(lines)].join(', ')}</p></div>`);
    if (stale && stale.changed === path) strips.unshift(`<div class="rk-strip" data-tone="warn">${icon('alert')}<p><b>Changed since the assessment.</b> This is the diff at <code>${pr.risk.head}</code>. The cited lines may have moved in <code>${stale.head}</code>.</p></div>`);
    if (!seen.size) {
      const msg = file.read === 'name' ? `<b>Read by name only.</b> The assessment didn't see what changed here${file.gen ? ' (generated)' : ''}.`
        : file.read === 'cut' ? '<b>Cut at the prompt budget.</b> The assessment saw how this file starts, not all of it.'
          : '<b>No reason cites this file.</b> It was read in full and nothing in it changed the level.';
      strips.push(`<div class="rk-strip" data-lvl="none">${icon(file.read === 'full' ? 'check' : 'eye')}<p>${msg}</p></div>`);
    }
    const read = w === 'diff' ? file.read : w;
    const counts = w === 'diff' ? `<span><span class="rk-plus">+${file.add}</span> <span class="rk-minus">−${file.del}</span></span>` : '';
    const content = file.read === 'name' ? '<p class="rk-empty">Its contents were not part of the assessment.</p>'
      : file.hunks ? codeBlock(file, flat(file), marks, w !== 'diff')
        : '<p class="rk-empty">Sample diff not included in this mockup.</p>';
    const treeItem = (f) => {
      const by = [...new Map(cits.filter((c) => c.a.f === f.path).map((c) => [c.r.id, c.r])).values()];
      const r = pr.files.includes(f) ? f.read : f.body ? 'body' : 'outside';
      return `<button type="button" data-act="file" data-path="${esc(f.path)}" data-fk="tree-${esc(f.path)}" aria-current="${f.path === path}" title="${esc(f.path)} · ${READ[r]}"><span class="rk-rd" data-read="${r}"></span><span class="rk-tree__name">${esc(base(f.path))}</span><span class="rk-cites">${by.map((x) => `<i data-lvl="${lvlOf(x)}">${x.id}</i>`).join('')}</span></button>`;
    };
    return `<div class="rk-walkbar">
        <button type="button" class="rk-btn rk-btn--ghost" data-act="back" data-fk="back">${icon('back')}Overview</button>
        <span class="rk-walkbar__path" title="${esc(path)}">${esc(path)}</span>
        <span class="rk-walkbar__count">${cur ? `Citation ${state.walk.ci + 1} of ${cits.length}` : plural(cits.length, 'citation')}</span>
        <button type="button" class="rk-btn rk-btn--icon" data-act="cite" data-d="-1" data-fk="prev" aria-label="Previous citation">${icon('left')}</button>
        <button type="button" class="rk-btn rk-btn--icon" data-act="cite" data-d="1" data-fk="next" aria-label="Next citation">${icon('right')}</button>
      </div>
      <div class="rk-walk">
        <nav class="rk-tree" aria-label="Files">
          <p class="rk-tree__h">In this PR</p>${pr.files.map(treeItem).join('')}
          ${pr.outside.length ? `<p class="rk-tree__h">Read outside the diff</p>${pr.outside.map(treeItem).join('')}` : ''}
        </nav>
        <section class="rk-file" aria-label="${esc(path)}">
          ${strips.join('')}
          <div class="rk-fhead"><code>${esc(path)}</code>${counts}<span><span class="rk-rd" data-read="${read}"></span>${READ[read]}</span></div>
          ${content}
        </section>
      </div>`;
  }

  /* ── Render and events ────────────────────────────────────────────────── */
  function syncTweak() {
    const pr = current();
    root.querySelectorAll('[data-tweak="state"] button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === st(pr))));
    root.querySelectorAll('[data-tweak="theme"] button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.theme)));
  }

  function render(focusKey) {
    const fk = focusKey ?? document.activeElement?.dataset?.fk;
    const pr = current();
    const card = state.view === 'walk' ? walk(pr) : `<div class="rk-body">${riskSection(pr)}${existingGuide(pr)}</div>`;
    app.innerHTML = `<div class="rk-deck"><span class="rk-deck__title">Quick review</span><div class="rk-tabs" role="tablist" aria-label="Pull requests">${tabs()}</div></div>
      <article class="rk-card" aria-label="Pull request #${pr.num}">${prHead(pr)}${card}</article>`;
    syncTweak();
    if (fk) app.querySelector(`[data-fk="${CSS.escape(fk)}"]`)?.focus({ preventScroll: true });
  }

  function openWalk(pr, ci, path) {
    const cits = citations(pr);
    state.view = 'walk';
    state.walk = ci >= 0 ? { path: cits[ci].a.f, ci } : { path, ci: cits.findIndex((c) => c.a.f === path) };
    render('back');
    const row = app.querySelector('.rk-l[data-current]');
    row?.scrollIntoView({ block: 'nearest' });
  }

  function assess(pr) {
    clearTimeout(assessTimer);
    state.overrides[pr.id] = 'assessing';
    render();
    assessTimer = setTimeout(() => {
      delete state.overrides[pr.id];
      render();
    }, 1800);
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act], [data-tweak] button');
    if (!t || !root.contains(t)) return;
    const pr = current();
    const group = t.closest('[data-tweak]');
    if (group) {
      if (group.dataset.tweak === 'state') {
        clearTimeout(assessTimer);
        if (t.dataset.v === 'sampled') delete state.overrides[pr.id];
        else state.overrides[pr.id] = t.dataset.v;
        if (state.view === 'walk' && !['sampled', 'stale'].includes(t.dataset.v)) state.view = 'overview';
      } else {
        state.theme = t.dataset.v;
        applyTheme();
      }
      render();
      return;
    }
    switch (t.dataset.act) {
      case 'pr':
        state.pr = t.dataset.id;
        state.view = 'overview';
        render(`tab-${t.dataset.id}`);
        break;
      case 'toggle': {
        if (t.classList.contains('rk-reason__row') && window.getSelection()?.toString()) return;
        const set = opened(pr);
        set.has(t.dataset.r) ? set.delete(t.dataset.r) : set.add(t.dataset.r);
        render(`toggle-${t.dataset.r}`);
        break;
      }
      case 'jump': {
        opened(pr).add(t.dataset.r);
        render(`toggle-${t.dataset.r}`);
        app.querySelector(`#rk-r-${pr.id}-${t.dataset.r}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        break;
      }
      case 'walk':
        e.stopPropagation();
        openWalk(pr, Number(t.dataset.ci), null);
        break;
      case 'file':
        openWalk(pr, -1, t.dataset.path);
        break;
      case 'cite': {
        const n = citations(pr).length;
        const ci = ((state.walk.ci < 0 ? -1 : state.walk.ci) + Number(t.dataset.d) + n) % n;
        openWalk(pr, ci, null);
        app.querySelector(`[data-fk="${t.dataset.fk}"]`)?.focus({ preventScroll: true });
        break;
      }
      case 'back':
        state.view = 'overview';
        render();
        break;
      case 'assess':
        assess(pr);
        break;
    }
  });

  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.view === 'walk') {
      state.view = 'overview';
      render();
    }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.classList?.contains('rk-tab')) {
      const i = PRS.findIndex((p) => p.id === state.pr);
      const next = PRS[(i + (e.key === 'ArrowRight' ? 1 : -1) + PRS.length) % PRS.length];
      state.pr = next.id;
      state.view = 'overview';
      render(`tab-${next.id}`);
    }
  });

  /* Theme: follow the host page in Auto. The base sheet sets the body text colour from its theme. */
  function hostIsDark() {
    const m = getComputedStyle(document.body).color.match(/[\d.]+/g);
    if (m && m.length >= 3) {
      const [r, g, b] = m.slice(0, 3).map(Number);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b > 128;
    }
    return matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyTheme() {
    root.dataset.theme = state.theme === 'auto' ? (hostIsDark() ? 'dark' : 'light') : state.theme;
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => state.theme === 'auto' && applyTheme());
  new MutationObserver(() => state.theme === 'auto' && applyTheme()).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });

  applyTheme();
  render();
})();
</script>
