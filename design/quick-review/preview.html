.form-select:focus-visible {

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

}

.form-check-label {

  box-shadow: none;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;

  height: 16px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {

}

.form-switch .form-check-input:checked::before {

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

) {

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  }

.text-warning,

    { path:&#x27;FSP.Application/Orders/SaveOrderHandler.cs&#x27;, group:&#x27;Order approval&#x27;, title:&#x27;Save first, then approve&#x27;, purpose:&#x27;A single handler owns the save and approval flow. Check the permission guard and what happens if approval fails after the save.&#x27;, start:38, lines:[[&#x27; &#x27;,&#x27;public async Task&lt;Result&gt; Handle(&#x27;],[&#x27; &#x27;,&#x27;    SaveOrderRequest request, CancellationToken ct)&#x27;],[&#x27; &#x27;,&#x27;{&#x27;],[&#x27; &#x27;,&#x27;    var order = await orders.Get(request.OrderId, ct);&#x27;],[&#x27; &#x27;,&#x27;&#x27;],[&#x27;+&#x27;,&#x27;    if (request.ApproveAfterSave)&#x27;],[&#x27;+&#x27;,&#x27;        await permissions.RequireApproval(order, ct);&#x27;],[&#x27;+&#x27;,&#x27;&#x27;],[&#x27; &#x27;,&#x27;    await orders.Save(order, ct);&#x27;],[&#x27; &#x27;,&#x27;&#x27;],[&#x27;-&#x27;,&#x27;    return Result.Success();&#x27;],[&#x27;+&#x27;,&#x27;    if (request.ApproveAfterSave)&#x27;],[&#x27;+&#x27;,&#x27;        await approvals.Approve(order.Id, ct);&#x27;],[&#x27;+&#x27;,&#x27;&#x27;],[&#x27;+&#x27;,&#x27;    return Result.Success(order.Id);&#x27;],[&#x27; &#x27;,&#x27;}&#x27;]] },

  const isTest = path =&gt; /(?:^|\/)[^/]*\.Tests(?:\/|$)|(?:^|\/)(?:tests|__tests__)(?:\/|$)|\.test\./i.test(path);
  const files = fixtures.map((f, id) =&gt; ({...f,id,test:isTest(f.path)})).sort((a,b) =&gt; Number(a.test)-Number(b.test) || a.id-b.id);
  const reviewed = new Set();

  let step = -1, mode = &#x27;browse&#x27;, editor = null, reviewText = &#x27;&#x27;, decision = &#x27;COMMENT&#x27;, lastBrowse = -1;
  const description = `&lt;div class=&quot;br-description&quot;&gt;&lt;div class=&quot;br-eyebrow&quot;&gt;PR description · written by the author&lt;/div&gt;&lt;h2&gt;Save and approve an order in one step&lt;/h2&gt;&lt;div class=&quot;br-intro&quot;&gt;&lt;p&gt;Dispatchers currently save an order, reopen it, and then approve it. This adds a second action alongside Save for people with approval permission.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;What changed&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Add an optional &lt;code&gt;ApproveAfterSave&lt;/code&gt; flag to the save request.&lt;/li&gt;&lt;li&gt;Check approval permission before saving, then approve the saved order.&lt;/li&gt;&lt;li&gt;Show &lt;strong&gt;Save &amp;amp; Approve&lt;/strong&gt; next to Save when the user has permission.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Expected behavior&lt;/h3&gt;&lt;table class=&quot;br-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Action&lt;/th&gt;&lt;th&gt;Result&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Save&lt;/td&gt;&lt;td&gt;Stores the changes and leaves approval unchanged.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Save &amp;amp; Approve&lt;/td&gt;&lt;td&gt;Stores the changes, approves the order, then returns to the order list.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;No approval permission&lt;/td&gt;&lt;td&gt;Only Save is shown. The API also rejects approval requests.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;h3&gt;Validation&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Handler tests cover saving without approval and denied approval.&lt;/li&gt;&lt;li&gt;UI tests cover action visibility and the approval flag.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;Notes for reviewers&lt;/h3&gt;&lt;p&gt;Please check the order of saving and approving. If approval fails, the dispatcher should understand whether their changes were saved.&lt;/p&gt;&lt;p class=&quot;br-muted br-small&quot;&gt;End of description · sample content for this design&lt;/p&gt;&lt;/div&gt;`;
  function status(message) { $(&#x27;#br-status&#x27;).textContent = message; }
  function counts() { return files.reduce((s,f) =&gt; { f.lines.forEach(l =&gt; { if(l[0]===&#x27;+&#x27;)s.add++; if(l[0]===&#x27;-&#x27;)s.del++; }); return s; },{add:0,del:0}); }

    $(&#x27;#br-overview&#x27;).setAttribute(&#x27;aria-current&#x27;,step===-1 &amp;&amp; mode===&#x27;browse&#x27;?&#x27;step&#x27;:&#x27;false&#x27;);
    $(&#x27;#br-nav&#x27;).innerHTML = [&#x27;Order approval&#x27;,&#x27;Documentation&#x27;,&#x27;Tests&#x27;].map(group =&gt; `&lt;details open&gt;&lt;summary&gt;${group} &lt;span class=&quot;br-muted&quot;&gt;· ${files.filter(f=&gt;f.group===group).length}&lt;/span&gt;&lt;/summary&gt;${files.map((f,i) =&gt; f.group===group?`&lt;button class=&quot;br-navitem&quot; data-step=&quot;${i}&quot; aria-current=&quot;${step===i&amp;&amp;mode===&#x27;browse&#x27;?&#x27;step&#x27;:&#x27;false&#x27;}&quot;&gt;&lt;span class=&quot;br-circle ${reviewed.has(i)?&#x27;br-done&#x27;:&#x27;&#x27;}&quot;&gt;${reviewed.has(i)?&#x27;✓&#x27;:i+1}&lt;/span&gt;&lt;span class=&quot;br-filetext&quot;&gt;&lt;span class=&quot;br-filename&quot;&gt;${esc(f.path.split(&#x27;/&#x27;).pop())}&lt;/span&gt;&lt;span class=&quot;br-filepath&quot;&gt;${esc(f.path.split(&#x27;/&#x27;).slice(0,-1).join(&#x27;/&#x27;))}&lt;/span&gt;&lt;/span&gt;${drafts.some(d=&gt;d.file===i)?&#x27;&lt;span aria-label=&quot;Has draft comment&quot;&gt;•&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/button&gt;`:&#x27;&#x27;).join(&#x27;&#x27;)}&lt;/details&gt;`).join(&#x27;&#x27;);
    $(&#x27;#br-progress-text&#x27;).textContent = `${reviewed.size} of ${files.length} files reviewed`;

  }
  function draftHTML(d,index) { return `&lt;div class=&quot;br-draft&quot;&gt;&lt;div class=&quot;br-row br-small&quot;&gt;&lt;strong&gt;You&lt;/strong&gt;&lt;span class=&quot;br-pill&quot;&gt;Draft&lt;/span&gt;&lt;span class=&quot;br-muted&quot;&gt;${esc(files[d.file].path.split(&#x27;/&#x27;).pop())} · ${d.side===&#x27;LEFT&#x27;?&#x27;old&#x27;:&#x27;new&#x27;} line ${d.line}&lt;/span&gt;&lt;span class=&quot;br-spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;br-quiet&quot; data-edit=&quot;${index}&quot;&gt;Edit&lt;/button&gt;&lt;button class=&quot;br-quiet&quot; data-delete=&quot;${index}&quot; aria-label=&quot;Delete draft ${index+1}&quot;&gt;Delete&lt;/button&gt;&lt;/div&gt;&lt;p&gt;${esc(d.body)}&lt;/p&gt;&lt;/div&gt;`; }

  }
  function diff() {
    const f = files[step]; let old = f.start, fresh = f.start;
    return `&lt;div class=&quot;br-purpose&quot;&gt;&lt;div class=&quot;br-eyebrow&quot;&gt;${esc(f.group)} · File ${step+1} of ${files.length}&lt;/div&gt;&lt;strong&gt;${esc(f.title)}&lt;/strong&gt;&lt;p class=&quot;br-muted&quot;&gt;${esc(f.purpose)}&lt;/p&gt;&lt;/div&gt;${choices.context?&#x27;&lt;details class=&quot;br-context&quot;&gt;&lt;summary&gt;PR context&lt;/summary&gt;&#x27;+description+&#x27;&lt;/details&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;br-filebar br-row&quot;&gt;&lt;span class=&quot;br-mono br-small&quot;&gt;${esc(f.path)}&lt;/span&gt;&lt;span class=&quot;br-spacer&quot;&gt;&lt;/span&gt;&lt;label class=&quot;br-small&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;br-viewed&quot; ${reviewed.has(step)?&#x27;checked&#x27;:&#x27;&#x27;}&gt; Reviewed&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;br-hunk&quot;&gt;@@ -${f.start},${f.lines.filter(l=&gt;l[0]!==&#x27;+&#x27;).length} +${f.start},${f.lines.filter(l=&gt;l[0]!==&#x27;-&#x27;).length} @@&lt;/div&gt;${f.lines.map((l,r) =&gt; {const left=l[0]===&#x27;+&#x27;?&#x27;&#x27;:old++,right=l[0]===&#x27;-&#x27;?&#x27;&#x27;:fresh++; return `&lt;div class=&quot;br-code-row ${l[0]===&#x27;+&#x27;?&#x27;br-add&#x27;:l[0]===&#x27;-&#x27;?&#x27;br-del&#x27;:&#x27;&#x27;} ${editor?.row===r?&#x27;br-selected&#x27;:&#x27;&#x27;}&quot;&gt;&lt;button class=&quot;br-plus&quot; data-line=&quot;${right||left}&quot; data-side=&quot;${l[0]===&#x27;-&#x27;?&#x27;LEFT&#x27;:&#x27;RIGHT&#x27;}&quot; data-row=&quot;${r}&quot; aria-label=&quot;Comment on ${l[0]===&#x27;-&#x27;?&#x27;old&#x27;:&#x27;new&#x27;} line ${right||left}&quot;&gt;+&lt;/button&gt;&lt;span class=&quot;br-line&quot;&gt;${left}&lt;/span&gt;&lt;span class=&quot;br-line&quot;&gt;${right}&lt;/span&gt;&lt;span class=&quot;br-sign&quot;&gt;${l[0]===&#x27; &#x27;?&#x27;&#x27;:l[0]}&lt;/span&gt;&lt;pre&gt;${esc(l[1])}&lt;/pre&gt;&lt;/div&gt;${editorHTML(r)}${drafts.map((d,i)=&gt;d.file===step&amp;&amp;d.row===r?draftHTML(d,i):&#x27;&#x27;).join(&#x27;&#x27;)}`;}).join(&#x27;&#x27;)}&lt;div class=&quot;br-content br-small br-muted&quot;&gt;End of file · Use + beside a line to comment. Drafts stay with the file.&lt;/div&gt;`;
  }
  function finish() {
    return `&lt;div class=&quot;br-content&quot;&gt;&lt;div class=&quot;br-eyebrow&quot;&gt;Finish this PR&lt;/div&gt;&lt;h2&gt;Review your comments and decision&lt;/h2&gt;&lt;div class=&quot;br-notice&quot;&gt;${reviewed.size} of ${files.length} files reviewed. ${files.length-reviewed.size} still unreviewed.&lt;/div&gt;${drafts.length?drafts.map(draftHTML).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;br-muted&quot;&gt;No inline comments yet.&lt;/p&gt;&#x27;}&lt;h3&gt;Review decision&lt;/h3&gt;${[[&#x27;COMMENT&#x27;,&#x27;Comment&#x27;,&#x27;Share feedback without approving.&#x27;],[&#x27;REQUEST_CHANGES&#x27;,&#x27;Request changes&#x27;,&#x27;Ask the author to address your feedback.&#x27;],[&#x27;APPROVE&#x27;,&#x27;Approve&#x27;,&#x27;The changes look ready to merge.&#x27;]].map(([v,t,d])=&gt;`&lt;label class=&quot;br-review-option&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;br-decision&quot; value=&quot;${v}&quot; ${decision===v?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;&lt;strong&gt;${t}&lt;/strong&gt;&lt;span class=&quot;br-filepath&quot;&gt;${d}&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;label for=&quot;br-review-text&quot;&gt;Overall comment &lt;span class=&quot;br-muted br-small&quot;&gt;${decision===&#x27;REQUEST_CHANGES&#x27;?&#x27;required&#x27;:&#x27;optional&#x27;}&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;br-review-text&quot; placeholder=&quot;Add any overall feedback...&quot;&gt;${esc(reviewText)}&lt;/textarea&gt;&lt;p class=&quot;br-small br-muted&quot;&gt;This prototype simulates submission. Your comments are kept only while this preview is open.&lt;/p&gt;&lt;/div&gt;`;

    $(&#x27;#br-main&#x27;).innerHTML = mode===&#x27;finish&#x27;?finish():mode===&#x27;done&#x27;?`&lt;div class=&quot;br-content&quot;&gt;&lt;div class=&quot;br-eyebrow&quot;&gt;Demo complete&lt;/div&gt;&lt;h2&gt;${decision===&#x27;APPROVE&#x27;?&#x27;Approval&#x27;:decision===&#x27;REQUEST_CHANGES&#x27;?&#x27;Change request&#x27;:&#x27;Review&#x27;} previewed&lt;/h2&gt;&lt;p&gt;${drafts.length} inline comment${drafts.length===1?&#x27;&#x27;:&#x27;s&#x27;} included. Nothing was posted to GitHub.&lt;/p&gt;&lt;p class=&quot;br-muted&quot;&gt;In the app, a successful submission would advance to the next PR. This mockup contains one sample PR.&lt;/p&gt;&lt;button id=&quot;br-resume&quot; class=&quot;br-primary&quot;&gt;Return to mockup&lt;/button&gt;&lt;/div&gt;`:mode===&#x27;paused&#x27;?&#x27;&lt;div class=&quot;br-content&quot;&gt;&lt;h2&gt;Review saved for later&lt;/h2&gt;&lt;p&gt;Your draft comments and file progress are retained in this preview.&lt;/p&gt;&lt;button id=&quot;br-resume&quot; class=&quot;br-primary&quot;&gt;Resume review&lt;/button&gt;&lt;/div&gt;&#x27;:step===-1?`&lt;div class=&quot;br-content&quot;&gt;${description}&lt;/div&gt;`:diff();

    root.style.setProperty(&#x27;--br-density&#x27;, choices.density===&#x27;Compact&#x27;?&#x27;22px&#x27;:&#x27;27px&#x27;);
    root.querySelectorAll(&#x27;.br-code-row&#x27;).forEach(el =&gt; { el.style.minHeight=choices.density===&#x27;Compact&#x27;?&#x27;22px&#x27;:&#x27;27px&#x27;; });
    if (focusedId) root.querySelector(`#${focusedId}`)?.focus({preventScroll:true});
  }
  function go(target) { step=Math.max(-1,Math.min(files.length-1,target)); lastBrowse=step; mode=&#x27;browse&#x27;; editor=null; render(); $(&#x27;#br-main&#x27;).scrollTop=0; status(step&lt;0?&#x27;Full PR description&#x27;:`File ${step+1} of ${files.length}: ${files[step].path}`); }
  function next(mark=false) { if(mark&amp;&amp;step&gt;=0) reviewed.add(step); if(step===files.length-1){mode=&#x27;finish&#x27;;render();$(&#x27;#br-main&#x27;).scrollTop=0;}else go(step+1); }
  function openEditor(file,row,line,side,editIndex) { step=file;lastBrowse=file;mode=&#x27;browse&#x27;;editor={row,line,side,editIndex};render();$(&#x27;#br-comment&#x27;).focus(); }
  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const b=event.target.closest(&#x27;button&#x27;); if(!b)return;
    if(b.dataset.step!==undefined)go(Number(b.dataset.step));
    else if(b.dataset.row!==undefined)openEditor(step,Number(b.dataset.row),Number(b.dataset.line),b.dataset.side);
    else if(b.dataset.delete!==undefined){drafts.splice(Number(b.dataset.delete),1);render();status(&#x27;Draft deleted.&#x27;);}
    else if(b.dataset.edit!==undefined){const i=Number(b.dataset.edit),d=drafts[i];buffers[`${d.file}:${d.row}`]=d.body;openEditor(d.file,d.row,d.line,d.side,i);}
    else switch(b.id){
      case &#x27;br-overview&#x27;:go(-1);break;
      case &#x27;br-next&#x27;:next();break;
      case &#x27;br-prev&#x27;:go(step-1);break;
      case &#x27;br-mark-next&#x27;:next(true);break;
      case &#x27;br-finish&#x27;:mode=&#x27;finish&#x27;;render();$(&#x27;#br-main&#x27;).scrollTop=0;break;
      case &#x27;br-back-review&#x27;:go(lastBrowse);break;
      case &#x27;br-toggle-files&#x27;:{const expanded=$(&#x27;.br-sidebar&#x27;).classList.toggle(&#x27;br-expanded&#x27;);b.setAttribute(&#x27;aria-expanded&#x27;,String(expanded));break;}
      case &#x27;br-cancel-comment&#x27;:editor=null;render();break;
      case &#x27;br-save-comment&#x27;:{const key=`${step}:${editor.row}`,body=(buffers[key]||&#x27;&#x27;).trim();if(!body)return;const draft={file:step,row:editor.row,line:editor.line,side:editor.side,body};if(editor.editIndex!==undefined)drafts[editor.editIndex]=draft;else drafts.push(draft);delete buffers[key];editor=null;render();status(&#x27;Draft saved. Nothing has been posted.&#x27;);break;}
      case &#x27;br-skip&#x27;:mode=&#x27;paused&#x27;;render();status(&#x27;Review paused in this preview.&#x27;);break;
      case &#x27;br-resume&#x27;:go(lastBrowse);break;
      case &#x27;br-submit&#x27;:if(decision===&#x27;REQUEST_CHANGES&#x27;&amp;&amp;!reviewText.trim()){status(&#x27;Add an overall comment to explain the requested changes.&#x27;);$(&#x27;#br-review-text&#x27;).focus();return;}mode=&#x27;done&#x27;;render();$(&#x27;#br-main&#x27;).scrollTop=0;status(&#x27;Submission simulated. Nothing was posted to GitHub.&#x27;);break;
    }
  });
  root.addEventListener(&#x27;input&#x27;,event=&gt;{if(event.target.id===&#x27;br-comment&#x27;){buffers[`${step}:${editor.row}`]=event.target.value;$(&#x27;#br-save-comment&#x27;).disabled=!event.target.value.trim();}if(event.target.id===&#x27;br-review-text&#x27;)reviewText=event.target.value;});
  root.addEventListener(&#x27;change&#x27;,event=&gt;{if(event.target.id===&#x27;br-viewed&#x27;){event.target.checked?reviewed.add(step):reviewed.delete(step);nav();}if(event.target.name===&#x27;br-decision&#x27;){decision=event.target.value;render();}});
  root.addEventListener(&#x27;keydown&#x27;,event=&gt;{if(event.ctrlKey||event.metaKey||event.altKey||event.target.closest(&#x27;input,textarea,select,[contenteditable=&quot;true&quot;]&#x27;)||mode!==&#x27;browse&#x27;)return;const key=event.key.toLowerCase();if(key===&#x27;n&#x27;){event.preventDefault();next();}if(key===&#x27;p&#x27;){event.preventDefault();go(step-1);}if(key===&#x27;v&#x27;&amp;&amp;step&gt;=0){event.preventDefault();reviewed.has(step)?reviewed.delete(step):reviewed.add(step);render();}});
  const totals=counts();$(&#x27;#br-stats&#x27;).innerHTML=`6 files &amp;nbsp; &lt;span class=&quot;br-positive&quot;&gt;+${totals.add}&lt;/span&gt; &lt;span class=&quot;br-negative&quot;&gt;−${totals.del}&lt;/span&gt;`;
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(choices,&#x27;context&#x27;,{label:&#x27;PR context inside each file&#x27;});tweak.addSelect(choices,&#x27;density&#x27;,{label:&#x27;Diff density&#x27;,options:[&#x27;Comfortable&#x27;,&#x27;Compact&#x27;]});}
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
