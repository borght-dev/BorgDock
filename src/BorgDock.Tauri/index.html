<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/borgdock-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BorgDock</title>
    <link rel="stylesheet" href="/entry/splash.css" />
    <script>
      (function(){try{var s=localStorage.getItem('borgdock-theme');var d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();
    </script>
  </head>
  <body class="bg-transparent overflow-hidden select-none">
    <div id="root">
      <div id="splash">
        <!-- Logo mark -->
        <div class="sp-tile">
          <svg width="28" height="28" viewBox="0 0 16 16" fill="none" class="sp-logo">
            <path d="M2 9 L4 9 L5.5 5 L7.5 12 L9 3 L11 11 L12.5 7 L14 9"
              stroke="white" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" class="sp-wave"/>
            <circle cx="14" cy="9" r="1.3" fill="white" opacity="0.85" class="sp-dot"/>
          </svg>
        </div>
        <!-- App name -->
        <div class="sp-name">BorgDock</div>
        <!-- Thin progress bar -->
        <div class="sp-track"><div class="sp-bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
