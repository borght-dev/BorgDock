name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-progress run when a newer one is queued for the same ref
# (PR push, master push). Master keeps its own group via refs/heads/master,
# so master commits don't cancel each other across runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window-actions:
    name: native window actions (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test deferred GUI actions
        shell: pwsh
        run: |
          $testExe = Join-Path $env:RUNNER_TEMP 'window-actions-tests.exe'
          rustc --edition 2021 --test src/BorgDock.Tauri/src-tauri/src/platform/deferred_actions.rs -o $testExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExe

  vitest:
    name: vitest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test -- --reporter=verbose

  playwright:
    name: playwright (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/BorgDock.Tauri/playwright-report
          retention-days: 3

  site:
    name: site (build and link check)
    # Pull requests only: master pushes are built by deploy-site.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      # Tokens check, astro check, astro build and the internal link check.
      - run: bun run site:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run site:build
      # The launch video project (site/video) is rendered locally, but its
      # TypeScript is checked here so it cannot rot between releases.
      - run: bun run site:video:typecheck

  rust:
    name: rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/BorgDock.Tauri/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Native tests and generated command contracts
        working-directory: src/BorgDock.Tauri/src-tauri
        run: cargo test --locked --lib
