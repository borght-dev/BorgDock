name: Deploy Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "docs/whats-new/**"
      - "design/site/**"
      - "src/BorgDock.Tauri/package.json"
      - "src/BorgDock.Tauri/src/styles/index.css"
      - "src/BorgDock.Tauri/src/styles/motion.css"
      - "scripts/site-tokens-check.ts"
      - ".github/workflows/deploy-site.yml"
  # Releases published by GITHUB_TOKEN do not trigger another workflow.
  workflow_run:
    workflows: ["Release Tauri"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile
      # Refresh site/src/data/release.json from the GitHub releases API. On any
      # error it keeps the committed file, so the build never depends on it.
      - run: bun run site:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run site:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: site/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove deployed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
