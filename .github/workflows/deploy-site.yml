name: Deploy Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "design/site/**"
      - "src/BorgDock.Tauri/package.json"
      - "src/BorgDock.Tauri/src/styles/index.css"
      - "src/BorgDock.Tauri/src/styles/motion.css"
      - "scripts/site-tokens-check.ts"
      - ".github/workflows/deploy-site.yml"
  # A new release changes the download page: refresh it as soon as it is out.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile
      # Refresh site/src/data/release.json from the GitHub releases API. On any
      # error it keeps the committed file, so the build never depends on it.
      - run: bun run site:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run site:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
